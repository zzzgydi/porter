version: 0.1

log:
  level: info

http:
  addr: :5000
  secret: ${REGISTRY_HTTP_SECRET}
  headers:
    X-Content-Type-Options: [nosniff]

storage:
  s3:
    accesskey: ${R2_ACCESS_KEY_ID}
    secretkey: ${R2_SECRET_ACCESS_KEY}
    region: auto
    regionendpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
    forcepathstyle: true
    bucket: ${R2_BUCKET_NAME}
    secure: true
    v4auth: true
    chunksize: 5242880
    rootdirectory: /docker-registry

  delete:
    enabled: true

  cache:
    blobdescriptor: redis

  maintenance:
    uploadpurging:
      enabled: true
      age: 168h
      interval: 24h
      dryrun: false
    readonly:
      enabled: false

redis:
  addrs:
    - redis:6379
  password: ${REDIS_PASSWORD}
  db: 0
  dialtimeout: 500ms
  readtimeout: 500ms
  writetimeout: 500ms
  poolsize: 64

auth:
  token:
    realm: ${REGISTRY_TOKEN_REALM}
    service: ${REGISTRY_SERVICE}
    issuer: ${REGISTRY_TOKEN_ISSUER}
    rootcertbundle: /certs/auth.crt
    jwks: /certs/jwks.json
    signingalgorithms:
      - RS256

notifications:
  events:
    includereferences: true
  endpoints:
    - name: console-api
      disabled: false
      url: http://registry-api:3000/internal/registry/events
      headers:
        Authorization:
          - Bearer ${WEBHOOK_SECRET}
      timeout: 3s
      threshold: 10
      backoff: 5s
      ignore:
        actions:
          - pull
          - mount
