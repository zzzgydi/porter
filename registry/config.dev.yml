version: 0.1

log:
  level: debug

http:
  addr: :5000
  headers:
    X-Content-Type-Options: [nosniff]

storage:
  filesystem:
    rootdirectory: /var/lib/registry

  delete:
    enabled: true

  cache:
    blobdescriptor: redis

  maintenance:
    uploadpurging:
      enabled: true
      age: 168h
      interval: 24h
      dryrun: false
    readonly:
      enabled: false

redis:
  addrs:
    - redis:6379
  password: ${REDIS_PASSWORD}
  db: 0
  dialtimeout: 500ms
  readtimeout: 500ms
  writetimeout: 500ms
  poolsize: 64

auth:
  token:
    realm: http://localhost:3000/api/registry/token
    service: localhost:5000
    issuer: private-registry-auth
    rootcertbundle: /certs/auth.crt
    jwks: /certs/jwks.json
    signingalgorithms:
      - RS256

notifications:
  events:
    includereferences: true
  endpoints:
    - name: console-api
      disabled: false
      url: http://registry-api:3000/internal/registry/events
      headers:
        Authorization:
          - Bearer ${WEBHOOK_SECRET}
      timeout: 3s
      threshold: 10
      backoff: 5s
      ignore:
        actions:
          - pull
          - mount
