services:
  registry:
    build:
      context: ./registry
    container_name: registry-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET:-change_me_registry_http_secret}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./registry/config.dev.yml:/etc/distribution/config.yml.template:ro
      - ./registry/certs:/certs:ro
      - ./registry/data:/var/lib/registry
    depends_on:
      - redis

  postgres:
    image: postgres:16
    container_name: registry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: registry-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
    container_name: registry-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_PORT: ${API_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REGISTRY_INTERNAL_URL: http://registry:5000
      REGISTRY_PUBLIC_URL: http://localhost:5000
      REGISTRY_SERVICE: localhost:5000
      REGISTRY_TOKEN_ISSUER: ${REGISTRY_TOKEN_ISSUER}
      REGISTRY_TOKEN_REALM: http://localhost:3000/api/registry/token
      REGISTRY_TOKEN_PRIVATE_KEY_PATH: /run/secrets/auth.key
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      API_JWT_SECRET: ${API_JWT_SECRET}
      CONSOLE_ORIGIN: ${CONSOLE_ORIGIN:-http://localhost:4173}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      DEV_MODE: "true"
    volumes:
      - ./registry/certs/auth.key:/run/secrets/auth.key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      registry:
        condition: service_started

  console:
    build:
      context: ./console
      args:
        VITE_API_BASE_URL: http://localhost:3000
        VITE_REGISTRY_PUBLIC_URL: ${REGISTRY_PUBLIC_URL:-http://localhost:5000}
    container_name: registry-console
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
      VITE_REGISTRY_PUBLIC_URL: ${REGISTRY_PUBLIC_URL:-http://localhost:5000}
    depends_on:
      - api

volumes:
  postgres_dev_data:
  redis_dev_data:
